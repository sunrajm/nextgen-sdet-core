name: Playwright Enterprise Regression Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # 1. Manual Trigger with Input Parameters
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Execution Environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - staging
          - dev
      project:
        description: 'Select Browser/Device Project'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - chromium
          - firefox
          - webkit
          - mobile-chrome

  # 2. Scheduled Cron Trigger (Runs daily at 00:00 UTC / 5:30 AM IST)
  schedule:
    - cron: '0 0 * * *'

jobs:
  test-matrix:
    name: Run ${{ matrix.project }} Suite
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chrome]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install
        working-directory: ./ts-playwright-engine

      - name: Install System OS Dependencies
        run: sudo npx playwright install-deps
        working-directory: ./ts-playwright-engine

      - name: Install Playwright Browsers
        run: npx playwright install
        working-directory: ./ts-playwright-engine

      - name: Execute Playwright Project Matrix
        env:
          CI: 'true'
          # Dynamically set TEST_ENV from manual dispatch input, defaulting to 'qa' for push/cron
          TEST_ENV: ${{ github.event.inputs.environment || 'qa' }}
        # Execute selected project or run all matrix projects
        run: |
          if [ "${{ github.event.inputs.project }}" != "" ] && [ "${{ github.event.inputs.project }}" != "all" ] && [ "${{ github.event.inputs.project }}" != "${{ matrix.project }}" ]; then
            echo "Skipping ${{ matrix.project }} as manual input selected ${{ github.event.inputs.project }}"
            exit 0
          fi
          npx playwright test --project=${{ matrix.project }}
        working-directory: ./ts-playwright-engine

      - name: Upload Project Blob Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.project }}
          path: ts-playwright-engine/blob-report/
          retention-days: 1

      - name: Upload Failure Triage Traces & Screenshots
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: failure-artifacts-${{ matrix.project }}
          path: ts-playwright-engine/test-results/
          retention-days: 7

  merge-reports:
    name: Merge Cross-Browser Reports
    needs: [test-matrix]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install
        working-directory: ./ts-playwright-engine

      - name: Download All Blob Reports
        uses: actions/download-artifact@v4
        with:
          path: ts-playwright-engine/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge Reports into Single HTML
        run: npx playwright merge-reports ./all-blob-reports --reporter=html
        working-directory: ./ts-playwright-engine

      - name: Upload Unified HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: unified-crossbrowser-html-report
          path: ts-playwright-engine/playwright-report/
          retention-days: 14

  notify-status:
    name: Post Slack Notification
    needs: [merge-reports, test-matrix]
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Send Slack Webhook Alert
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ needs.test-matrix.result }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
          text: |
            *Playwright Enterprise Suite Execution Finished*
            *Environment:* `${{ inputs.environment || 'qa' }}`
            *Trigger:* `${{ github.eventName }}`
            *Status:* `${{ needs.test-matrix.result }}`