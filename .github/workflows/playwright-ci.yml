name: Playwright Enterprise Regression Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-matrix:
    name: Run ${{matrix.project}} suite
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
       project: [chromium, firefox, WebKit,mobile-chrome]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install
        working-directory: ./ts-playwright-engine

      - name: Install System OS Dependencies
        run: sudo npx playwright install-deps
        working-directory: ./ts-playwright-engine

      - name: Install Playwright Browsers
        run: npx playwright install
        working-directory: ./ts-playwright-engine

      - name: Execute Playwright Project Matrix
        env:
          CI: 'true'
          TEST_ENV: 'qa'
        run: npx playwright test --project=${{ matrix.project }}
        working-directory: ./ts-playwright-engine

      - name: Upload Project Blob Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.project }}
          path: ts-playwright-engine/blob-report/
          retention-days: 1

      - name: Upload Failure Triage Traces & Screenshots
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
         name: failure-artifact-${{ matrix.project }}
         path: ts-playwright-engine/test-results/
         retention-days: 7

  merge-reports:
    name: Merge Cross Browser Reports
    needs: [ test-matrix ]
    if: ${{!cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install
        working-directory: ./ts-playwright-engine

      - name: Download All Blob Reports
        uses: actions/download-artifact@v4
        with:
          path: ts-playwright-engine/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge Reports into Single HTML
        run: npx playwright merge-reports ./all-blob-reports --reporter=html
        working-directory: ./ts-playwright-engine

      - name: Upload Unified HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: unified-playwright-html-report
          path: ts-playwright-engine/playwright-report/
          retention-days: 14