name: Playwright Enterprise Regression Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Playwright E2E Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install
        working-directory: ./ts-playwright-engine

      - name: Install System OS Dependencies
        run: sudo npx playwright install-deps
        working-directory: ./ts-playwright-engine

      - name: Install Playwright Browsers
        run: npx playwright install
        working-directory: ./ts-playwright-engine

      - name: Execute Playwright Suite (QA Environment)
        env:
          CI: 'true'
          TEST_ENV: 'qa'
        run: npx playwright test
        working-directory: ./ts-playwright-engine

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: ts-playwright-engine/playwright-report/
          retention-days: 14