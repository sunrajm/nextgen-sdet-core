name: Playwright Enterprise Regression Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Execution Environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - staging
          - dev
      project:
        description: 'Select Browser/Device Project'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - chromium
          - firefox
          - webkit
          - mobile-chrome
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-matrix:
    name: Run ${{ matrix.project }} Suite
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [ chromium, firefox, webkit, mobile-chrome ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ts-playwright-engine/package-lock.json

      - name: Install Dependencies
        run: npm ci || npm install
        working-directory: ./ts-playwright-engine

      - name: Install Target Matrix Browser
        run: |
          BROWSER_TARGET="${{ matrix.project }}"
          if [ "$BROWSER_TARGET" = "mobile-chrome" ]; then
            BROWSER_TARGET="chromium"
          fi
          npx playwright install --with-deps $BROWSER_TARGET
        working-directory: ./ts-playwright-engine

      - name: Execute Playwright Project Matrix
        env:
          CI: 'true'
          TEST_ENV: ${{ github.event.inputs.environment || 'qa' }}
        run: |
          SELECTED_PROJECT="${{ github.event.inputs.project }}"
          if [ -n "$SELECTED_PROJECT" ] && [ "$SELECTED_PROJECT" != "all" ] && [ "$SELECTED_PROJECT" != "${{ matrix.project }}" ]; then
            echo "Skipping ${{ matrix.project }} as manual input selected $SELECTED_PROJECT"
            exit 0
          fi
          npx playwright test --project=${{ matrix.project }}
        working-directory: ./ts-playwright-engine

      - name: Upload Project Blob Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.project }}
          path: ts-playwright-engine/blob-report/
          retention-days: 1

      - name: Upload Failure Triage Traces & Screenshots
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: failure-artifacts-${{ matrix.project }}
          path: |
            ts-playwright-engine/test-results/**/*.png
            ts-playwright-engine/test-results/**/*.zip
            ts-playwright-engine/test-results/**/*.webm
          retention-days: 7

  merge-reports:
    name: Merge Cross-Browser Reports
    needs: [ test-matrix ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install
        working-directory: ./ts-playwright-engine

      - name: Download All Blob Reports
        uses: actions/download-artifact@v4
        with:
          path: ts-playwright-engine/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge Reports into Single HTML
        run: npx playwright merge-reports ./all-blob-reports --reporter=html
        working-directory: ./ts-playwright-engine

      - name: Upload Unified HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: unified-crossbrowser-html-report
          path: ts-playwright-engine/playwright-report/
          retention-days: 14

  failure-triage-email:
    name: Parse Failure Logs & Send Email Alert
    needs: [ test-matrix, merge-reports ]
    if: ${{ always() && needs.test-matrix.result == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Failure Artifacts
        uses: actions/download-artifact@v4
        if: ${{ always() }}
        with:
          path: ts-playwright-engine/failure-artifacts
          pattern: failure-artifacts-*
          merge-multiple: true

      - name: Extract Failure Logs
        id: parse-logs
        run: |
          echo "=== Extracting Failed Specs ==="
          mkdir -p ts-playwright-engine/triage-summary
          
          if [ -d "ts-playwright-engine/failure-artifacts" ]; then
            ls -la ts-playwright-engine/failure-artifacts > ts-playwright-engine/triage-summary/failed-files.txt
          else
            echo "No trace artifacts found." > ts-playwright-engine/triage-summary/failed-files.txt
          fi
          
          echo "FAILED_BUILD_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_ENV

      - name: Check Email Alert Configuration
        id: mail-config
        shell: bash
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_RECIPIENT: ${{ secrets.MAIL_RECIPIENT }}
        run: |
          if [ -n "${MAIL_SERVER:-}" ] && [ -n "${MAIL_PORT:-}" ] && [ -n "${MAIL_USERNAME:-}" ] && [ -n "${MAIL_PASSWORD:-}" ] && [ -n "${MAIL_RECIPIENT:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Custom HTML Failure Email
        if: ${{ steps.mail-config.outputs.enabled == 'true' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🚨 CRITICAL: Playwright Regression Failure - ${{ github.event.inputs.environment || 'qa' }} Environment"
          to: ${{ secrets.MAIL_RECIPIENT }}
          from: "Playwright CI Bot <${{ secrets.MAIL_USERNAME }}>"
          secure: true
          html_body: |
            <h2>Playwright Test Execution Failed</h2>
            <p><strong>Environment:</strong> ${{ github.event.inputs.environment || 'qa' }}</p>
            <p><strong>Triggered By:</strong> ${{ github.actor }} (${{ github.eventName }})</p>
            <p><strong>Branch/Ref:</strong> ${{ github.ref }}</p>
            <p><strong>Commit:</strong> ${{ github.sha }}</p>
            <hr />
            <h3>Action Required</h3>
            <p>One or more cross-browser test suites failed during parallel matrix execution.</p>
            <p><a href="${{ env.FAILED_BUILD_URL }}" style="background-color: #d9534f; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px;">View Pipeline Run & Download HTML Report</a></p>

  notify-status:
    name: Post Slack Notification
    needs: [ merge-reports, test-matrix ]
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Check Slack Notification Configuration
        id: slack-config
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Slack Webhook Alert
        if: ${{ steps.slack-config.outputs.enabled == 'true' }}
        uses: slackapi/slack-github-action@v1.26.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        with:
          payload: |
            {
              "text": "🎭 *Playwright Suite Finished*\n*Environment:* `${{ github.event.inputs.environment || 'qa' }}`\n*Status:* `${{ needs.test-matrix.result }}`\n*Repository:* `${{ github.repository }}`\n*Triggered By:* `${{ github.actor }}`"
            }